# Theatre showtimes listing, dispatched by the UI (with the user's PAT) when
# browsing shows. Writes browse.json to the data branch, which the UI polls
# and renders as a tappable list so you never paste a URL. One file, always
# overwritten, so the data branch doesn't accumulate per-date junk.
#
# AMC's Cloudflare blocks GitHub's runners, so the app normally has an iOS
# Shortcut fetch the pages on the phone and upload them zipped to
# data/inbox/<id>.zip; with `inbox` set this run only parses that upload.
name: fetch-showtimes

on:
  workflow_dispatch:
    inputs:
      theatre:
        description: Theatre path after /movie-theatres/ (e.g. boston/amc-boston-common-19)
        required: true
      date:
        description: First date to list (YYYY-MM-DD)
        required: true
      days:
        description: How many consecutive days to fetch
        required: false
        default: "1"
      inbox:
        description: Upload id under data/inbox/ to parse instead of fetching AMC
        required: false
        default: ""

permissions:
  contents: write

# A user-initiated browse must never sit behind (and be cancelled by) the
# self-chaining poll run, so it gets its own group rather than sharing "poll".
# A newer browse dispatch supersedes an older queued one (latest-wins).
concurrency:
  group: fetch-showtimes
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Fetch showtimes
        env:
          THEATRE: ${{ github.event.inputs.theatre }}
          DATE: ${{ github.event.inputs.date }}
          DAYS: ${{ github.event.inputs.days }}
          INBOX: ${{ github.event.inputs.inbox }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, zipfile
          sys.path.insert(0, "scripts")
          import amc
          theatre = os.environ["THEATRE"].strip()
          date = os.environ["DATE"].strip()
          days = int((os.environ.get("DAYS") or "1").strip() or "1")
          inbox = (os.environ.get("INBOX") or "").strip()
          if inbox:
              if not re.fullmatch(r"[a-z0-9]{6,40}", inbox):
                  sys.exit(f"bad inbox id: {inbox!r}")
              zpath = f"data/inbox/{inbox}.zip"
              # The Shortcut names each day's page by its 1-based index in date
              # order ("1", "1.html", ...); folders and __MACOSX entries are noise.
              with zipfile.ZipFile(zpath) as z:
                  named = {}
                  for n in z.namelist():
                      m = re.fullmatch(r"(?:.*/)?(\d+)(?:\.[A-Za-z]+)*", n)
                      if m and not n.startswith("__MACOSX"):
                          named[int(m.group(1))] = z.read(n).decode("utf-8", "replace")
              pages = [named[k] for k in sorted(named)]
              print(f"{zpath}: {len(pages)} page(s)", [len(p) for p in pages])
              if not pages:
                  sys.exit("upload had no numbered pages")
              os.remove(zpath)
              listing = amc.showtimes_range_listing(theatre, date, pages)
          else:
              listing = amc.fetch_showtimes_range(theatre, date, days, log=print)
          with open("data/browse.json", "w") as f:
              json.dump(listing, f, indent=2, sort_keys=True)
              f.write("\n")
          print(f"wrote data/browse.json: {listing['days']} day(s),",
                f"{len(listing['movies'])} movies,",
                sum(len(m["showings"]) for m in listing["movies"]), "showings")
          EOF
      - name: Push to data branch
        run: |
          cd data
          git config user.name "seat-scanner"
          git config user.email "seat-scanner@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to push"; exit 0; }
          git commit -m "fetch-showtimes: ${{ github.event.inputs.theatre }} ${{ github.event.inputs.date }}"
          # No longer serialized against poll via the concurrency group, so a
          # concurrent poll push can win the race; rebase our commit on top and
          # retry rather than failing the whole browse. -X theirs keeps our
          # file if the (near-impossible) same-file conflict ever happens.
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:data && exit 0
            echo "push rejected (attempt $attempt); rebasing on origin/data"
            git fetch origin data
            git rebase -X theirs origin/data
            sleep "$attempt"
          done
          git push origin HEAD:data
