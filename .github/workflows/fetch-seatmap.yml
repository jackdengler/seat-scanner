# One-off seat map fetch, dispatched by the UI (with the user's PAT) when
# adding a watch. Writes seatmap-<id>.json to the data branch, which the
# UI polls and then renders for seat picking.
name: fetch-seatmap

on:
  workflow_dispatch:
    inputs:
      showtimeId:
        description: AMC showtime ID
        required: true

permissions:
  contents: write

# Keyed per showtime so it never shares (and gets cancelled in) the "poll"
# group, while still de-duplicating concurrent fetches of the same seat map.
concurrency:
  group: fetch-seatmap-${{ github.event.inputs.showtimeId }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Fetch seat map
        run: |
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, "scripts")
          import amc
          sid = "${{ github.event.inputs.showtimeId }}".strip()
          try:
              seatmap = amc.fetch_seatmap(sid, log=print)
          except amc.FetchBlocked as e:
              # Same as the browse: a block that outlived its retries is nearly
              # always transient, and reads better than a traceback.
              print(f"::error::AMC blocked the fetch ({e.diagnosis}). This is "
                    "usually a transient Cloudflare challenge from the runner's "
                    "IP; try adding the watch again.")
              raise SystemExit(1)
          with open(f"data/seatmap-{sid}.json", "w") as f:
              json.dump(seatmap, f, indent=2, sort_keys=True)
              f.write("\n")
          print(f"wrote data/seatmap-{sid}.json:",
                sum(s["available"] for s in seatmap["seats"]),
                "of", len(seatmap["seats"]), "seats available")
          EOF
      - name: Push to data branch
        run: |
          cd data
          git config user.name "seat-scanner"
          git config user.email "seat-scanner@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to push"; exit 0; }
          git commit -m "fetch-seatmap: ${{ github.event.inputs.showtimeId }}"
          # Not serialized against poll anymore, so retry over a concurrent push.
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:data && exit 0
            echo "push rejected (attempt $attempt); rebasing on origin/data"
            git fetch origin data
            git rebase -X theirs origin/data
            sleep "$attempt"
          done
          git push origin HEAD:data
