# One-off seat map fetch, dispatched by the UI (with the user's PAT) when
# adding a watch. Writes seatmap-<id>.json to the data branch, which the
# UI polls and then renders for seat picking.
name: fetch-seatmap

on:
  workflow_dispatch:
    inputs:
      showtimeId:
        description: AMC showtime ID
        required: true

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Fetch seat map
        run: |
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, "scripts")
          import amc
          sid = "${{ github.event.inputs.showtimeId }}".strip()
          seatmap = amc.fetch_seatmap(sid, log=print)
          with open(f"data/seatmap-{sid}.json", "w") as f:
              json.dump(seatmap, f, indent=2, sort_keys=True)
              f.write("\n")
          print(f"wrote data/seatmap-{sid}.json:",
                sum(s["available"] for s in seatmap["seats"]),
                "of", len(seatmap["seats"]), "seats available")
          EOF
      - name: Push to data branch
        run: |
          cd data
          git config user.name "seat-scanner"
          git config user.email "seat-scanner@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "fetch-seatmap: ${{ github.event.inputs.showtimeId }}"; git push origin HEAD:data; }
