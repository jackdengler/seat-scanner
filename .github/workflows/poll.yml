name: poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - run: pip install --quiet pywebpush
      - name: Check watches
        id: check
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          python3 scripts/check.py --data data | tee check.log
          echo "all_done=$(grep -q 'ALL_DONE=true' check.log && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "chain=$(grep -q 'CHAIN=true' check.log && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Push state/seatmap updates to data branch
        run: |
          cd data
          git config user.name "seat-scanner"
          git config user.email "seat-scanner@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "poll: update state and seatmaps"; git push origin HEAD:data; }
      - name: Chain the next run while a showtime is imminent
        if: steps.check.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml -R "$GITHUB_REPOSITORY"
      - name: Disable polling when no active watches remain
        if: steps.check.outputs.all_done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable poll.yml -R "$GITHUB_REPOSITORY"
